spring.application.name=pedidos-service

# H2 en memoria. MODE=LEGACY habilita la funcion IDENTITY() que usa el codigo
# original ("CALL IDENTITY()") y que H2 2.x solo conserva en ese modo de compatibilidad.
spring.datasource.url=jdbc:h2:mem:pedidosdb;MODE=LEGACY
spring.datasource.username=sa
spring.datasource.password=
# IDENTITY() es por sesion: con una sola conexion el INSERT y el CALL IDENTITY()
# del codigo original se ejecutan siempre sobre la misma sesion.
spring.datasource.hikari.maximum-pool-size=1

spring.sql.init.mode=always
spring.h2.console.enabled=true
server.port=8080
